<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<meta name="theme-color" content="#2448c7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="주식추천">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
</head>
<body>
<title>주식 추천 대시보드</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* 레이아웃: 짙은 남색 앱 바(제목·기준일·탭) 아래로 카드형 섹션이 이어지는 증권 앱 구성.
   요약(큰 숫자) → 조작(필터·선택) → 상세(표·그래프) 순서. 숫자는 고정폭 서체로 줄을 맞춤 */
:root{
  --bg:#f2f4f7; --surface:#ffffff; --sunken:#eef1f5; --ink:#101623; --ink-2:#3a4354; --muted:#667085; --line:#e1e5ec; --line-2:#cfd6e0;
  --bar:#0e1a33; --bar-ink:#eef2fb; --bar-muted:#9fb0cf; --bar-line:#22314f;
  --accent:#2448c7; --accent-ink:#ffffff; --accent-soft:#e8edfc;
  --buy:#0a7a52; --buy-bg:#e2f5ec; --hold:#6b5c1a; --hold-bg:#f3eed9; --sell:#c0313a; --sell-bg:#fbe7e8; --mid:#c3cad6;
  --up:#d1303a; --down:#1f5bd0;
  --c1:#2a78d6; --c2:#eb6834; --c3:#1baf7a; --c4:#eda100; --c5:#e87ba4; --c6:#008300; --c7:#6250d6; --cN:#7b8496;
  --font-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --font-num:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:12px; --r-sm:8px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0b0f17; --surface:#131925; --sunken:#1a2130; --ink:#e8ecf3; --ink-2:#c3cad6; --muted:#8f9aae; --line:#242d3d; --line-2:#323d51;
  --bar:#0a1226; --bar-ink:#eef2fb; --bar-muted:#8d9cbb; --bar-line:#1c2a47;
  --accent:#7e9cff; --accent-ink:#0b0f17; --accent-soft:#1e2847;
  --buy:#4fd3a0; --buy-bg:#123227; --hold:#e3cb6c; --hold-bg:#30291a; --sell:#ff7f87; --sell-bg:#3a1a1e; --mid:#3d475a;
  --up:#ff7a82; --down:#79a5ff;
  --c1:#3987e5; --c2:#d95926; --c3:#199e70; --c4:#c98500; --c5:#d55181; --c6:#008300; --c7:#9085e9; --cN:#8a93a5;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b0f17; --surface:#131925; --sunken:#1a2130; --ink:#e8ecf3; --ink-2:#c3cad6; --muted:#8f9aae; --line:#242d3d; --line-2:#323d51;
  --bar:#0a1226; --bar-ink:#eef2fb; --bar-muted:#8d9cbb; --bar-line:#1c2a47;
  --accent:#7e9cff; --accent-ink:#0b0f17; --accent-soft:#1e2847;
  --buy:#4fd3a0; --buy-bg:#123227; --hold:#e3cb6c; --hold-bg:#30291a; --sell:#ff7f87; --sell-bg:#3a1a1e; --mid:#3d475a;
  --up:#ff7a82; --down:#79a5ff;
  --c1:#3987e5; --c2:#d95926; --c3:#199e70; --c4:#c98500; --c5:#d55181; --c6:#008300; --c7:#9085e9; --cN:#8a93a5;
  color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font:14px/1.55 var(--font-body);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bar)}
.num{font-family:var(--font-num);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.tnum{font-variant-numeric:tabular-nums}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.inner{max-width:1240px;margin:0 auto}
button,select,input{font:inherit}
button:focus-visible,select:focus-visible,input:focus-visible,summary:focus-visible,a:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* 앱 바 */
.appbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--bar);color:var(--bar-ink);border-bottom:1px solid var(--bar-line)}
.appbar .inner{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding-block:12px}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto;min-width:0}
.logo{width:28px;height:28px;border-radius:8px;background:#2448c7;display:grid;place-items:center;flex:none}
.brand h1{font-size:17px;font-weight:700;margin:0;letter-spacing:-.01em;white-space:nowrap}
.asof{font-size:12px;color:var(--bar-muted);white-space:nowrap}
.tabs{display:inline-flex;background:var(--bar-line);border-radius:999px;padding:3px}
.tabs a{color:var(--bar-muted);text-decoration:none;font-weight:600;font-size:13.5px;padding:6px 16px;border-radius:999px}
.tabs a[aria-current="page"]{background:var(--bar-ink);color:var(--bar)}
main{padding-block:20px 64px}
main>.inner{display:grid;gap:18px}
.view{display:grid;gap:18px;min-width:0}
.view>*,.card>*{min-width:0}

/* 공통 카드·제목 */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.card-h{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:4px 12px;padding:16px 18px 0}
.card-h h2{font-size:15.5px;font-weight:700;margin:0;letter-spacing:-.01em;text-wrap:balance}
.card-h p{margin:0;color:var(--muted);font-size:12.5px}
.card-b{padding:14px 18px 18px}
.sect{display:flex;align-items:baseline;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-top:6px}
.sect h2{font-size:18px;font-weight:700;margin:0;letter-spacing:-.015em}
.sect p{margin:0;color:var(--muted);font-size:13px}
.label{font-size:11.5px;font-weight:600;letter-spacing:.04em;color:var(--muted)}
.muted{color:var(--muted)}.dim{color:var(--muted)}
.up{color:var(--up)}.down{color:var(--down)}

/* 버튼류 */
.seg{display:inline-flex;background:var(--sunken);border-radius:9px;padding:3px;gap:2px}
.seg button{border:0;background:none;color:var(--ink-2);padding:5px 12px;border-radius:7px;font-size:13px;cursor:pointer;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(16,22,35,.12)}
.chip{border:1px solid var(--line-2);background:var(--surface);color:var(--ink-2);border-radius:999px;padding:4px 11px;font-size:12.5px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
.chip .n{color:var(--muted);font-weight:400;margin-left:4px;font-size:11px}
select,input[type=search]{font-size:13px;color:var(--ink);background:var(--surface);border:1px solid var(--line-2);border-radius:8px;padding:6px 9px;max-width:100%}
input[type=search]{flex:1 1 200px;min-width:0}
.linkbtn{border:0;background:none;color:var(--accent);font-size:13px;cursor:pointer;padding:6px 4px}
.dir{border:1px solid var(--line-2);background:var(--surface);color:var(--ink);border-radius:8px;padding:6px 9px;font-size:12px;cursor:pointer;white-space:nowrap}
.badge{display:inline-block;padding:1px 8px;border-radius:999px;font-size:11.5px;font-weight:600;white-space:nowrap}
.g-추천{background:var(--buy-bg);color:var(--buy)}.g-중립{background:var(--hold-bg);color:var(--hold)}.g-비추천{background:var(--sell-bg);color:var(--sell)}

/* KPI */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--line);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.kpi{background:var(--surface);padding:12px 18px}
.kpi>span{display:block;color:var(--muted);font-size:12px}
.kpi>b{display:block;font-size:20px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.35}
.kpi>small{color:var(--muted);font-size:12px}

/* 오늘의 상위 추천 */
.picks{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.pick{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:grid;gap:6px;cursor:pointer;text-align:left;color:inherit}
.pick:hover{border-color:var(--accent)}
.pick .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.pick .nm{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pick .sc{font-size:22px;font-weight:600;letter-spacing:-.02em}
.pick .meta{font-size:12px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap}
.ring{--p:0;width:42px;height:42px;border-radius:50%;flex:none;display:grid;place-items:center;
  background:conic-gradient(var(--accent) calc(var(--p)*1%),var(--sunken) 0)}
.ring b{width:34px;height:34px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-size:12px;font-weight:600}

/* 분포 막대 */
.dist{display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--sunken);gap:2px}
.dist i{display:block;height:100%}
.d-추천{background:var(--buy)}.d-중립{background:var(--mid)}.d-비추천{background:var(--sell)}
.sumrow{display:flex;flex-wrap:wrap;gap:8px 26px;align-items:baseline;padding:16px 18px 12px}
.sumrow div span{color:var(--muted);font-size:12px;display:block}
.sumrow b{font-size:22px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.sumdist{padding:0 18px 16px}

/* 빠른 보기 */
.presets{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:thin}
.preset{flex:none;border:1px solid var(--line-2);background:var(--surface);color:var(--ink-2);border-radius:999px;padding:7px 14px;font-size:13px;cursor:pointer}
.preset:hover{border-color:var(--accent);color:var(--ink)}
.preset[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--surface)}

/* 필터 패널 */
.panel>summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:8px;padding:13px 18px;font-weight:600}
.panel>summary::-webkit-details-marker{display:none}
.panel>summary .applied{font-weight:400;color:var(--muted);font-size:12.5px}
.panel>summary::after{content:"펼치기";white-space:nowrap;font-weight:500;font-size:12.5px;color:var(--accent)}
.panel[open]>summary::after{content:"접기"}
.panel[open]>summary{border-bottom:1px solid var(--line)}
.prow{display:grid;grid-template-columns:84px 1fr;gap:10px;align-items:start;padding:11px 18px;border-top:1px solid var(--line)}
.prow:first-of-type{border-top:0}
.prow>.label{padding-top:7px}
.ctrls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;min-width:0}
.sortpair{display:inline-flex;align-items:center;gap:4px}
.sortpair small{color:var(--muted);font-size:12px}

/* 묶음·표 */
.bar{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px}
.bar p{margin:0;color:var(--muted);font-size:13px}
.groups{display:grid;gap:12px}
.grp{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.grp>summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:1fr auto;gap:6px 14px;align-items:center;padding:13px 18px}
.grp>summary::-webkit-details-marker{display:none}
.gname{font-weight:600;font-size:15px;display:flex;align-items:center;gap:9px;min-width:0}
.gname::before{content:"";width:7px;height:7px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(-45deg);transition:transform .15s;flex:none}
.grp[open]>summary .gname::before{transform:rotate(45deg)}
.gstats{display:flex;gap:14px;align-items:center;color:var(--muted);font-size:12px;white-space:nowrap}
.gstats .dist{width:90px;height:6px}
.gstats b{color:var(--ink);font-weight:600}
.tbox{overflow-x:auto;border-top:1px solid var(--line)}
.flat .tbox,.card .tbox.first{border-top:0}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:9px 12px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
tbody tr:last-child td{border-bottom:0}
th{background:var(--sunken);color:var(--muted);font-weight:600;font-size:12px}
th[data-s]{cursor:pointer;user-select:none}
th.on{color:var(--accent)}
th.l,td.l{text-align:left}
th:first-child,td:first-child{position:sticky;left:0;z-index:1}
th:first-child{background:var(--sunken)}
td:first-child{background:var(--surface)}
tbody tr.row{cursor:pointer}
tbody tr.row:hover td,tbody tr.sel td{background:var(--accent-soft)}
.nm{font-weight:600;display:inline-block;max-width:230px;overflow:hidden;text-overflow:ellipsis;vertical-align:bottom}
.code{color:var(--muted);font-size:11.5px;margin-left:6px}
.mk{font-size:10.5px;color:var(--muted);border:1px solid var(--line-2);border-radius:4px;padding:0 4px;margin-left:6px}
.meter{display:inline-block;width:44px;height:5px;border-radius:3px;background:var(--sunken);vertical-align:middle;margin-left:6px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent)}
.detail td{white-space:normal;text-align:left;background:var(--sunken);cursor:default;padding:12px 14px}
.detail .dinner{position:sticky;left:14px;max-width:min(760px,calc(100vw - 64px));display:grid;gap:6px}
.tags{display:flex;flex-wrap:wrap;gap:5px}
.tag{font-size:11.5px;border:1px solid var(--line-2);border-radius:999px;padding:1px 8px;background:var(--surface)}
.more{display:flex;justify-content:center;padding:10px;border-top:1px solid var(--line)}
.more button{border:1px solid var(--line-2);background:var(--surface);color:var(--ink);padding:6px 14px;border-radius:8px;font-size:13px;cursor:pointer}
.empty{background:var(--surface);border:1px dashed var(--line-2);border-radius:var(--r);padding:28px 16px;text-align:center;color:var(--muted)}
.note{color:var(--muted);font-size:12px;margin:0;max-width:80ch}

/* 모의투자 */
.strat-dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:8px;vertical-align:middle;flex:none}
.legend{display:flex;flex-wrap:wrap;gap:6px}
.legend button{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink-2);border-radius:999px;padding:3px 10px;font-size:12px;cursor:pointer}
.legend button[aria-pressed="false"]{opacity:.45}
.legend i{width:14px;height:0;border-top:2px solid;display:inline-block}
.chartbox{position:relative;min-width:0}
svg.chart{display:block;width:100%;overflow:visible}
svg.chart text{fill:var(--muted);font:11px var(--font-num)}
svg.chart .lbl{fill:var(--ink);font-weight:500}
svg.chart .grid{stroke:var(--line);stroke-width:1}
svg.chart .zero{stroke:var(--line-2);stroke-width:1.2}
svg.chart .hair{stroke:var(--muted);stroke-width:1;stroke-dasharray:3 3}
.tip{position:absolute;pointer-events:none;background:var(--surface);border:1px solid var(--line-2);border-radius:8px;padding:8px 10px;font-size:12px;box-shadow:0 6px 18px rgba(10,15,25,.14);white-space:nowrap;display:grid;gap:3px;z-index:3}
.tip .k{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
.chartnote{color:var(--muted);font-size:13px;padding:22px 12px;text-align:center;border:1px dashed var(--line-2);border-radius:var(--r-sm)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px 18px;margin:0}
.stats div{display:grid;gap:1px}
.stats dt{color:var(--muted);font-size:12px}
.stats dd{margin:0;font-size:16px;font-weight:600;font-variant-numeric:tabular-nums}
.callout{background:var(--sunken);border-radius:var(--r-sm);padding:10px 12px;font-size:12.5px;color:var(--ink-2)}
.side-매수{color:var(--up);font-weight:600}.side-매도{color:var(--down);font-weight:600}.side-배당,.side-분할,.side-비용{color:var(--muted);font-weight:600}
.subtabs{display:flex;gap:6px;flex-wrap:wrap}
details.fold>summary{cursor:pointer;padding:13px 18px;font-weight:600;list-style:none;display:flex;justify-content:space-between;gap:8px}
details.fold>summary::-webkit-details-marker{display:none}
details.fold>summary span{color:var(--muted);font-weight:400;font-size:12.5px}
details.fold>summary::after{content:"펼치기";font-weight:500;font-size:12.5px;color:var(--accent);white-space:nowrap}
details.fold[open]>summary::after{content:"접기"}
details.fold{border-top:1px solid var(--line)}
.rules-t td,.rules-t th{text-align:left}
@media (max-width:820px){.two{grid-template-columns:1fr}}
@media (max-width:720px){
  .prow{grid-template-columns:1fr;gap:6px}
  .prow>.label{padding-top:0}
  .hide-m{display:none}
  .gstats .dist{display:none}
  .nm{max-width:130px}
  .appbar .inner{padding-block:10px}
  .tabs{order:3;width:100%;justify-content:stretch}
  .tabs a{flex:1;text-align:center}
  .kpi{padding:10px 14px}
  .kpi>b{font-size:18px}
  .kpi:last-child:nth-child(odd){grid-column:1/-1}
  .picks{grid-auto-flow:column;grid-template-columns:none;grid-auto-columns:78%;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:4px}
  .pick{scroll-snap-align:start}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<header class="appbar gut">
  <div class="inner">
    <div class="brand">
      <span class="logo" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 16 16"><rect x="1.5" y="9" width="3" height="5.5" rx=".9" fill="#fff"/><rect x="6.5" y="6" width="3" height="8.5" rx=".9" fill="#fff"/><rect x="11.5" y="2" width="3" height="12.5" rx=".9" fill="#4fd3a0"/></svg></span>
      <h1>주식 추천 대시보드</h1>
      <span class="asof" id="asof"></span>
    </div>
    <nav class="tabs" aria-label="화면">
      <a href="#stocks" id="tab-stocks">종목 분석</a>
      <a href="#paper" id="tab-paper">모의투자</a>
    </nav>
  </div>
</header>

<main class="gut">
<div class="inner">

  <div class="view" id="view-paper" hidden></div>

  <div class="view" id="view-stocks">
    <section aria-label="오늘의 상위 추천">
      <div class="sect"><h2>오늘의 상위 추천</h2><p id="picks-note"></p></div>
    </section>
    <div class="picks" id="picks"></div>

    <section class="card" aria-label="현재 보기 요약">
      <div class="sumrow" id="sum"></div>
      <div class="sumdist"><div class="dist" id="sumdist" aria-hidden="true"></div></div>
    </section>

    <nav class="presets" id="presets" aria-label="빠른 보기"></nav>

    <details class="card panel" id="panel">
      <summary><span>필터·정렬 <span class="applied" id="applied"></span></span></summary>
      <div class="prow"><span class="label">대상</span>
        <div class="ctrls">
          <div class="seg" id="country"></div>
          <select id="market" aria-label="시장"></select>
          <input type="search" id="q" placeholder="기업명·종목코드·세부업종 검색" aria-label="검색">
        </div></div>
      <div class="prow"><span class="label">등급·규모</span><div class="ctrls" id="gradesize"></div></div>

<script>
const P=JSON.parse(document.getElementById("payload").textContent);
const D=P.dict, ST=P.styles, MK=P.marketKo;
const DATA=P.rows.map(r=>{const o={};P.cols.forEach((k,i)=>o[k]=r[i]);
  for(const k of ["market","sector","group","size","grade"]) o[k]=D[k][o[k]];
  o.styles=o.styles.map(i=>ST[i]);o.id=o.country+o.ticker;return o;});
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const f=(v,d=1)=>v==null||Number.isNaN(v)?"–":Number(v).toLocaleString("ko-KR",{minimumFractionDigits:d,maximumFractionDigits:d});
const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v);}catch(e){return d;}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}};
const price=r=>r.price==null?"–":r.country==="US"?"$"+f(r.price,2):f(r.price,0)+"원";
const cap=r=>{if(r.cap_usd==null)return"–";if(r.country==="KR"){const w=r.cap_usd*1e6*P.usdkrw;return w>=1e12?f(w/1e12,1)+"조":f(w/1e8,0)+"억";}
  return r.cap_usd>=1000?"$"+f(r.cap_usd/1000,1)+"B":"$"+f(r.cap_usd,0)+"M";};
const pct=(v,d=1)=>v==null?'<span class="dim">–</span>':`<span class="${v>0?"up":v<0?"down":""}">${v>0?"+":""}${f(v,d)}%</span>`;

$("asof").textContent=`기준일 ${P.asOf}`;

/* ───────────────── 종목 분석 ───────────────── */
const SORTS={score:"종합점수",tech_score:"기술점수",value_score:"가치점수",ret_3m:"3개월 수익률",ret_1w:"1주 수익률",
  cap_usd:"시가총액",per:"PER",pbr:"PBR",roe:"ROE",div_yield:"배당수익률",rsi:"RSI",name:"기업명"};
const LOW_FIRST=new Set(["per","pbr","rsi","name"]);
const BY={none:"묶지 않음",group:"업종별로 묶기",size:"규모별로 묶기",grade:"등급별로 묶기",market:"시장별로 묶기",country:"나라별로 묶기",styles:"스타일별로 묶기"};
const GORDER={avg:"평균 점수 높은 묶음 먼저",buy:"추천 비율 높은 묶음 먼저",count:"종목 많은 묶음 먼저",name:"기본 순서"};
const DEFAULT={country:"",market:"",q:"",grades:[],sizes:[],group:"",styles:[],by:"group",gorder:"avg",s1:"score",d1:-1,s2:"value_score",d2:-1,preset:""};
const PRESETS=[
  {id:"top",t:"업종별 추천 상위",s:{by:"group",gorder:"buy",s1:"score",d1:-1}},
  {id:"bluechip",t:"대형 우량주",s:{sizes:["대형주"],styles:["고수익성"],by:"group",s1:"score",d1:-1}},
  {id:"value",t:"저평가 + 상승추세",s:{styles:["저평가","상승추세"],by:"group",s1:"value_score",d1:-1,s2:"score",d2:-1}},
  {id:"div",t:"고배당",s:{styles:["고배당"],by:"group",s1:"div_yield",d1:-1,s2:"score",d2:-1}},
  {id:"rebound",t:"과매도 반등 후보",s:{styles:["과매도"],by:"none",s1:"value_score",d1:-1,s2:"rsi",d2:1}},
  {id:"momentum",t:"모멘텀 강세",s:{styles:["모멘텀 강세"],by:"size",gorder:"name",s1:"ret_3m",d1:-1}},
  {id:"avoid",t:"비추천 점검",s:{grades:["비추천"],by:"group",gorder:"count",s1:"score",d1:1}},
];
const KEY="stock-dash-v2";
let st={...DEFAULT,...store.get(KEY,{})}; let openRow=null; const limits={}; const closed=new Set(); const touched=new Set();
const save=()=>store.set(KEY,st);

function renderPicks(){
  const top=c=>DATA.filter(r=>r.country===c&&r.grade==="추천").sort((a,b)=>b.score-a.score).slice(0,4);
  const list=[...top("KR"),...top("US")];
  $("picks-note").textContent="나라별 종합점수 상위 4종목 · 누르면 아래 표에서 찾아줘요";
  $("picks").innerHTML=list.map(r=>`<button class="pick" data-q="${esc(r.ticker)}" data-c="${r.country}">
    <div class="top"><div style="min-width:0"><div class="nm">${esc(r.name)}</div>
      <div class="meta"><span class="num">${esc(r.ticker)}</span><span>${esc(MK[r.market]||r.market)}</span><span>${esc(r.group)}</span></div></div>
      <span class="ring" style="--p:${r.score}"><b class="num">${f(r.score,0)}</b></span></div>
    <div class="meta"><span>3개월 ${pct(r.ret_3m)}</span><span>PER ${f(r.per)}</span><span>ROE ${r.roe==null?"–":f(r.roe)+"%"}</span></div></button>`).join("")
    ||'<div class="empty">오늘은 추천 종목이 없어요</div>';
}
$("picks").addEventListener("click",e=>{const b=e.target.closest(".pick");if(!b)return;$("q").value=b.dataset.q;
  set({...DEFAULT,country:b.dataset.c,q:b.dataset.q,by:"none"});openRow=b.dataset.c+b.dataset.q;render();$("out").scrollIntoView({behavior:"smooth",block:"start"});});

function base(skip){const q=st.q.trim().toLowerCase();
  return DATA.filter(r=>(!st.country||r.country===st.country)&&(!st.market||r.market===st.market)&&
    (skip==="grade"||!st.grades.length||st.grades.includes(r.grade))&&(skip==="size"||!st.sizes.length||st.sizes.includes(r.size))&&
    (skip==="group"||!st.group||r.group===st.group)&&(skip==="styles"||st.styles.every(s=>r.styles.includes(s)))&&
    (!q||r.name.toLowerCase().includes(q)||r.ticker.toLowerCase().includes(q)||r.sector.toLowerCase().includes(q)));}
function cmp(a,b,k,d){const x=a[k],y=b[k];if(x==null&&y==null)return 0;if(x==null)return 1;if(y==null)return -1;
  return (typeof x==="string"?x.localeCompare(y,"ko"):x-y)*d;}
function sortRows(rows){return rows.sort((a,b)=>cmp(a,b,st.s1,st.d1)||cmp(a,b,st.s2,st.d2)||cmp(a,b,"score",-1));}

function niceStep(span){return [0.25,0.5,1,2,5,10,20,50,100].find(s=>span/s<=5)||200;}
function lineChart(el,dates,series,{height=240,unit="%"}={}){
  const vis=series.filter(s=>s.on!==false&&s.values.some(v=>v!=null));
  const n=dates.length;
  if(n<2||!vis.length){el.innerHTML=`<div class="chartnote">그래프는 기록이 이틀 이상 쌓이면 보여요. (지금 ${n}일)</div>`;return;}
  const W=Math.max(300,el.clientWidth||600),H=height,narrow=W<520,L=narrow?40:46,R=vis.length<=4?(narrow?58:92):12,T=12,B=26;
  const ys=vis.flatMap(s=>s.values).filter(v=>v!=null);
  let lo=Math.min(0,...ys),hi=Math.max(0,...ys);const pad=Math.max(0.3,(hi-lo)*0.1);lo-=pad;hi+=pad;
  const step=niceStep(hi-lo);lo=Math.floor(lo/step)*step;hi=Math.ceil(hi/step)*step;
  const x=i=>L+(W-L-R)*i/(n-1),y=v=>T+(H-T-B)*(hi-v)/(hi-lo);
  let g="";for(let v=lo;v<=hi+1e-9;v+=step){const z=Math.abs(v)<1e-9;g+=`<line class="${z?"zero":"grid"}" x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end">${v>0?"+":""}${+v.toFixed(2)}${unit}</text>`;}
  const path=s=>{let d="",pen=false;s.values.forEach((v,i)=>{if(v==null){pen=false;return;}d+=(pen?"L":"M")+x(i).toFixed(1)+","+y(v).toFixed(1);pen=true;});return d;};
  const lines=vis.map(s=>`<path d="${path(s)}" fill="none" stroke="var(${s.color})" stroke-width="${s.bold?2.4:2}" ${s.dash?`stroke-dasharray="${s.dash}"`:""} stroke-linejoin="round" stroke-linecap="round"/>`).join("");
  let ends="";
  if(vis.length<=4){const e=vis.map(s=>{let i=s.values.length-1;while(i>=0&&s.values[i]==null)i--;return i<0?null:{s,i,v:s.values[i],yy:y(s.values[i])};}).filter(Boolean).sort((a,b)=>a.yy-b.yy);
    for(let k=1;k<e.length;k++)if(e[k].yy-e[k-1].yy<14)e[k].yy=e[k-1].yy+14;
    ends=e.map(o=>`<circle cx="${x(o.i)}" cy="${y(o.v)}" r="4" fill="var(${o.s.color})" stroke="var(--surface)" stroke-width="2"/><text class="lbl" x="${x(n-1)+8}" y="${o.yy+4}">${o.v>0?"+":""}${f(o.v,1)}${unit}</text>`).join("");}
  el.innerHTML=`<svg class="chart" viewBox="0 0 ${W} ${H}" height="${H}" role="img" aria-label="누적 수익률 그래프">${g}
    <text x="${L}" y="${H-6}">${dates[0]}</text><text x="${W-R}" y="${H-6}" text-anchor="end">${dates[n-1]}</text>
    ${lines}${ends}<line class="hair" y1="${T}" y2="${H-B}" x1="0" x2="0" opacity="0"/>
    <rect x="${L}" y="${T}" width="${W-L-R}" height="${H-T-B}" fill="transparent" tabindex="0" aria-label="그래프 위를 움직이면 날짜별 값이 보여요"/></svg><div class="tip" hidden></div>`;
  const svg=el.querySelector("svg"),hair=svg.querySelector(".hair"),tip=el.querySelector(".tip"),hit=svg.querySelector("rect");
  const show=i=>{const px=x(i);hair.setAttribute("x1",px);hair.setAttribute("x2",px);hair.setAttribute("opacity",1);tip.hidden=false;tip.replaceChildren();
    const d=document.createElement("div");d.textContent=dates[i];d.style.fontWeight="600";tip.append(d);
    vis.forEach(s=>{const r=document.createElement("div");const k=document.createElement("span");k.className="k";k.style.background=`var(${s.color})`;
      const v=s.values[i];r.append(k,`${s.name} ${v==null?"–":(v>0?"+":"")+f(v,2)+unit}`);tip.append(r);});
    const sx=svg.getBoundingClientRect().width/W;const tw=tip.offsetWidth||180;tip.style.left=Math.max(0,Math.min(px*sx+14,el.clientWidth-tw))+"px";tip.style.top="8px";};
  const near=e=>{const r=svg.getBoundingClientRect();const vx=(e.clientX-r.left)*W/r.width;return Math.max(0,Math.min(n-1,Math.round((vx-L)/(W-L-R)*(n-1))));};
  let cur=n-1;

  hit.addEventListener("focus",()=>show(cur));hit.addEventListener("blur",()=>{tip.hidden=true;hair.setAttribute("opacity",0);});
  hit.addEventListener("keydown",e=>{if(e.key==="ArrowLeft"){cur=Math.max(0,cur-1);show(cur);}if(e.key==="ArrowRight"){cur=Math.min(n-1,cur+1);show(cur);}});
}
function barChart(el,labels,values,{unit="%",height=170,color="--c1",note=""}={}){

  const W=Math.max(260,el.clientWidth||400),H=height,L=46,R=10,T=18,B=24;
  const vs=values.filter(v=>v!=null);let lo=Math.min(0,...vs),hi=Math.max(0,...vs);const pad=Math.max(0.05,(hi-lo)*0.15);lo-=lo<0?pad:0;hi+=pad;
  const step=niceStep(hi-lo);lo=Math.floor(lo/step)*step;hi=Math.ceil(hi/step)*step;

  let g="";for(let v=lo;v<=hi+1e-9;v+=step)g+=`<line class="${Math.abs(v)<1e-9?"zero":"grid"}" x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end">${v>0?"+":""}${+v.toFixed(2)}${unit}</text>`;

    const d=top?`M${x0},${y1}V${y0+r}Q${x0},${y0} ${x0+r},${y0}H${x0+w-r}Q${x0+w},${y0} ${x0+w},${y0+r}V${y1}Z`:`M${x0},${y0}V${y1-r}Q${x0},${y1} ${x0+r},${y1}H${x0+w-r}Q${x0+w},${y1} ${x0+w},${y1-r}V${y0}Z`;
    return `<path d="${d}" fill="var(${color})"><title>${esc(labels[i])}: ${v>0?"+":""}${f(v,2)}${unit}</title></path>

}

    </div></section>

  <div class="sect"><h2>점수가 실제로 맞는지</h2><p>모의투자 20종목보다 훨씬 많은 데이터로 점수 자체를 검증해요</p></div>

function drawPaperChart(M){
  const key=pst.market;const hid=pst.hidden[key]||(pst.hidden[key]=null);
  const series=[...M.accounts.map(a=>({id:a.id,name:a.name,values:a.curve,color:SCOL[a.strategy],dash:a.strategy==="random"?"5 4":"",bold:a.id===pst.acct})),
    ...Object.entries(M.curves.series).map(([nm,vals],i)=>({id:"b:"+nm,name:nm,values:vals,color:nm.startsWith("동일가중")?"--cN":BCOL[i%3],dash:nm.startsWith("동일가중")?"2 3":""}))];
  const def=new Set([pst.acct,M.accounts.find(a=>a.strategy==="random")?.id,"b:동일가중(전 종목)","b:"+M.bench_names[0]]);
  const hidden=new Set(hid||series.filter(s=>!def.has(s.id)).map(s=>s.id));
  series.forEach(s=>s.on=!hidden.has(s.id));
  $("plegend").innerHTML=series.map(s=>`<button data-sid="${esc(s.id)}" aria-pressed="${s.on}"><i style="border-color:var(${s.color});${s.dash?"border-top-style:dashed":""}"></i>${esc(s.name)}</button>`).join("");
  $("plegend").onclick=e=>{const b=e.target.closest("button");if(!b)return;const id=b.dataset.sid;hidden.has(id)?hidden.delete(id):hidden.add(id);pst.hidden[key]=[...hidden];psave();drawPaperChart(M);};
  lineChart($("pchart"),M.curves.dates,series,{height:260});
}
function drawValidation(){
  const m=pst.market,V=(PA.validation||{})[m]||{},B=(PA.backtest||{})[m]||{};
  const hz=V.horizons||{},keys=["5","20","60"],labels={"5":"1주 뒤","20":"1개월 뒤","60":"3개월 뒤"};
  const H=hz[pst.hz];
  const need={"5":5,"20":20,"60":60}[pst.hz];
  $("valcard").innerHTML=`<div class="card-h"><h2>실제 기록으로 검증</h2><p>${V.snapshots||0}일치 점수 기록${V.first?` · ${V.first}부터`:""}</p></div>
  <div class="card-b" style="display:grid;gap:12px">
    <div class="seg" id="hz">${keys.map(k=>`<button data-h="${k}" aria-pressed="${k===pst.hz}">${labels[k]}</button>`).join("")}</div>
    ${H?`<dl class="stats"><div><dt>평균 IC</dt><dd>${f(H.ic_mean,3)}</dd></div><div><dt>IC가 양수인 날</dt><dd>${f(H.ic_hit,0)}%</dd></div><div><dt>t값</dt><dd>${H.ic_t==null?"–":f(H.ic_t,2)}</dd></div><div><dt>검증 날짜 · 종목</dt><dd>${H.n_dates} · ${H.n_obs.toLocaleString()}</dd></div></dl>
      <div><div class="label">점수 5분위별 이후 평균 수익률</div><div class="chartbox" id="vq"></div></div>
      <div class="callout">${H.ic_mean>0.02&&(H.ic_t??0)>2?"점수가 높은 종목이 실제로 더 오르는 경향이 통계적으로 보여요.":H.ic_mean>0?"방향은 맞지만 아직 확신하기엔 데이터가 부족해요.":"지금까지는 점수와 실제 수익률의 관계가 보이지 않아요."}
        기술점수 IC ${f(H.ic_tech,3)} · 가치점수 IC ${f(H.ic_value,3)}${H.ic_legacy==null?"":` · 예전 점수 IC ${f(H.ic_legacy,3)}`} · 등급별: ${Object.entries(H.grades||{}).map(([g,v])=>`${g} ${v>0?"+":""}${f(v,2)}%`).join(" · ")}</div>`
     :`<div class="chartnote">점수를 매긴 날부터 ${labels[pst.hz]} 수익률이 나와야 검증할 수 있어요.<br>첫 결과는 거래일 ${need}일 뒤에 보여요. 지금 쌓인 점수 기록 ${V.snapshots||0}일.</div>`}
    <p class="note">IC는 그날 점수 순위와 이후 수익률 순위가 얼마나 같은 방향인지(-1~1)예요. 0.03~0.05만 꾸준해도 쓸모 있는 수준이고, t값이 2를 넘으면 우연일 가능성이 낮아요.</p>
  </div>`;
  if(H)barChart($("vq"),["1분위\n(낮음)","2","3","4","5분위\n(높음)"].map(s=>s.split("\n")[0]),H.quintiles,{color:"--c1"});
  $("hz").onclick=e=>{const b=e.target.closest("button");if(!b)return;pst.hz=b.dataset.h;psave();drawValidation();};

  const BV=B.versions||{},ORD=B.order||Object.keys(BV),V3=BV.v3,V2=BV.v2,TOT=BV.total;
  const VC={total:"--c1",total_v2:"--c5",value:"--c3",v3:"--c7",v2:"--c2"};
  const main=TOT||V3;
  $("btcard").innerHTML=`<div class="card-h"><h2>과거 백테스트: 점수 방식별 비교</h2><p>${B.period?`${B.period[0]} ~ ${B.period[1]} · `:""}점수 상위 ${B.n||20}종목, ${B.every||5}거래일마다 교체${B.value_coverage!=null?` · 과거 재무 반영 ${f(B.value_coverage,0)}%`:""}</p></div>
  <div class="card-b" style="display:grid;gap:12px">
    ${main?`<div class="tbox" style="border:1px solid var(--line);border-radius:8px"><table><thead><tr><th class="l">점수 방식</th><th>상위 20 누적</th><th>동일가중</th><th class="hide-m">최대 낙폭</th><th>평균 IC</th><th class="hide-m">IC t값</th></tr></thead><tbody>
      ${ORD.map(k=>{const x=BV[k];return `<tr><td class="l"><span class="strat-dot" style="background:var(${VC[k]})"></span>${esc(x.label||k)}${(TOT?k==="total":k==="v3")?' <span class="dim">(지금 사용)</span>':""}</td><td class="num">${signed(x.top,1)}</td><td class="num">${signed(x.ew,1)}</td><td class="num hide-m">${f(x.mdd,1)}%</td><td class="num">${f(x.ic,3)}</td><td class="num hide-m">${f(x.ic_t,2)}</td></tr>`;}).join("")}
      </tbody></table></div>
      <div class="chartbox" id="btc"></div>
      <div><div class="label">${esc(main.label||"")} 5분위별 20일 뒤 평균 수익률</div><div class="chartbox" id="btq"></div></div>
      <div class="callout">IC는 점수 순위와 이후 수익률 순위가 같은 방향인 정도예요. ${TOT?`종합점수 IC ${f(TOT.ic,3)} · 가치점수만 ${f(BV.value.ic,3)} · 기술점수만 ${f(V3.ic,3)}.`:""}
        ${main.top<main.ew?" 상위 20종목만 골라 담는 방식은 이 기간 동일가중보다 낮았어요. 점수는 나쁜 종목을 피하는 데 더 확실하게 쓸모가 있다는 뜻이에요.":" 상위 20종목 전략이 동일가중보다 나았어요."}</div>`
     :'<div class="chartnote">주가 기록이 충분히 쌓이면 계산돼요.</div>'}
    <p class="note">가치점수는 그날까지 <b>발표돼 있던</b> 실적(한국 연간 90일·분기 45일, 미국 75일 뒤부터)으로 PER·PBR·ROE를 다시 계산했어요. 연간·분기 실적 기준이라 실제 그날 값과 조금 다를 수 있고, 미국은 재무 이력을 며칠에 걸쳐 모아요. 지금 상장된 종목만으로 계산해 상장폐지 종목이 빠져 있어(생존자 편향) 실제보다 좋게 나올 수 있어요. 수수료와 체결 불리함은 반영했어요.</p>
  </div>`;
  if(main){lineChart($("btc"),B.dates,[...["total","value","v3"].filter(k=>BV[k]).map(k=>({name:BV[k].label,values:BV[k].curve,color:VC[k],bold:k==="total"})),
      {name:"동일가중(전 종목)",values:B.ew_curve,color:"--cN",dash:"2 3"}],{height:210});
    barChart($("btq"),["1분위","2","3","4","5분위"],main.quintiles,{color:"--c1"});}
}
