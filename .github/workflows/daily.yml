name: 매일 주식 분석

on:
  schedule:
    - cron: "43 8 * * 1-5"    # 한국시간 17:43 (한국장 마감 후)
    - cron: "13 22 * * 1-5"   # 한국시간 다음날 07:13 (미국장 마감 후)
  workflow_dispatch:          # Actions 탭에서 'Run workflow' 버튼으로 수동 실행

permissions:
  contents: write

concurrency: daily-analysis

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # 주가 기록(용량이 커서 저장소에 올리지 않음)은 캐시로 이어 붙입니다
      - name: 주가 기록 불러오기
        uses: actions/cache/restore@v4
        with:
          path: |
            data/prices_kr.csv
            data/prices_us.csv
          key: prices-${{ github.run_id }}
          restore-keys: prices-

      - name: 분석 실행
        env:
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
        run: python src/main.py

      - name: 주가 기록 저장
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            data/prices_kr.csv
            data/prices_us.csv
          key: prices-${{ github.run_id }}

      - name: 결과 올리기
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add data/companies_*.csv results docs || true
          git diff --cached --quiet || git commit -m "분석 결과 $(date -u +%F)"
          git push
