name: 매일 주식 분석

on:
  schedule:
    - cron: "43 8 * * 1-5"    # 한국시간 17:43 (한국장 마감 후)
    - cron: "13 22 * * 1-5"   # 한국시간 다음날 07:13 (미국장 마감 후)
  workflow_dispatch:          # Actions 탭에서 'Run workflow' 버튼으로 수동 실행

permissions:
  contents: write
  issues: write

concurrency: daily-analysis

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      # 실행을 예약한 시점이 아니라 '시작하는 시점'의 최신 코드·기록으로 시작 (앞 실행 결과와 충돌 방지)
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt pytest

      # 검사가 실패해도 분석·대시보드는 계속 만들고, 기록이 틀어질 수 있는 모의투자만 쉼
      - name: 계산 검사 (모의투자·검증 테스트)
        id: tests
        continue-on-error: true
        run: python -m pytest -q tests

      # 주가 기록(용량이 커서 저장소에 올리지 않음)은 캐시로 이어 붙입니다
      - name: 주가 기록 불러오기
        uses: actions/cache/restore@v4
        with:
          path: |
            data/prices_kr.v2.csv.gz
            data/prices_us.v2.csv.gz
            data/last_analysis_*.csv.gz
          key: prices-v2-${{ github.run_id }}
          restore-keys: prices-v2-

      # 한 번 실패하면 5분 뒤 한 번 더 (일시적인 접속 오류 대비)
      - name: 분석 실행
        id: analyze
        env:
          SAFE_MODE: ${{ steps.tests.outcome == 'failure' && '1' || '' }}
        run: |
          python src/main.py && exit 0
          echo "1차 실행 실패 → 5분 뒤 다시 시도"
          sleep 300
          python src/main.py

      - name: 주가 기록 저장
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            data/prices_kr.v2.csv.gz
            data/prices_us.v2.csv.gz
            data/last_analysis_*.csv.gz
          key: prices-v2-${{ github.run_id }}

      - name: 결과 올리기
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add data/companies_*.csv data/fundamentals_*.csv results docs paper || true
          git diff --cached --quiet || git commit -m "분석 결과 $(date -u +%F)"
          if ! git pull --rebase origin main; then
            git rebase --abort
            echo "다른 실행이 먼저 결과를 올려서 충돌했어요. 이번 결과는 올리지 않아요."
            exit 1
          fi
          git push

      - name: 상태 알림 (문제 있으면 이슈, 정상으로 돌아오면 자동으로 닫기)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LEVEL=$(python -c "import json;print(json.load(open('docs/status.json')).get('level','failed'))" 2>/dev/null || echo failed)
          [ "${{ steps.analyze.outcome }}" != "success" ] && LEVEL=failed
          [ "${{ job.status }}" != "success" ] && [ "$LEVEL" = "ok" ] && LEVEL=degraded
          DETAIL=$(python -c "import json;s=json.load(open('docs/status.json'));print('\n'.join('- '+e for e in s.get('errors',[])) or '- 자세한 내용은 실행 기록을 보세요')" 2>/dev/null || echo "- 자세한 내용은 실행 기록을 보세요")
          echo "상태: $LEVEL"
          bash .github/scripts/alert.sh "$LEVEL" "$DETAIL"
