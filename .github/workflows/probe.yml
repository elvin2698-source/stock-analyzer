name: 점검용 (과거 실적 데이터 형식)
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -q yfinance pandas requests
      - run: |
          python3 - <<'PY'
          import requests, json, time, yfinance as yf, pandas as pd
          UA={"User-Agent":"Mozilla/5.0 (iPhone; CPU iPhone OS 17_0 like Mac OS X)"}
          for code in ["005930","035720","000270"]:
              for kind in ["annual","quarter"]:
                  j=requests.get(f"https://m.stock.naver.com/api/stock/{code}/finance/{kind}",headers=UA,timeout=20).json()
                  fi=j["financeInfo"]; print("NAVER",code,kind,[(t["key"],t["isConsensus"]) for t in fi["trTitleList"]])
                  for r in fi["rowList"]:
                      if r["title"] in ("EPS","BPS","주당배당금","ROE","PER","PBR"): print("   ",r["title"],{k:v["value"] for k,v in r["columns"].items()})
          t0=time.time()
          for s in ["AAPL","NVDA","KO","PYPL","BNB"]:
              try:
                  t=yf.Ticker(s); inc=t.income_stmt; bal=t.balance_sheet
                  print("YF",s,"inc cols",[str(c.date()) for c in inc.columns],"rows has", [x for x in ["Diluted EPS","Basic EPS","Net Income","Net Income Common Stockholders"] if x in inc.index])
                  print("   EPS", inc.loc["Diluted EPS"].to_dict() if "Diluted EPS" in inc.index else None)
                  print("   bal rows", [x for x in ["Stockholders Equity","Common Stock Equity","Ordinary Shares Number","Share Issued"] if x in bal.index])
                  print("   equity", bal.loc["Common Stock Equity"].to_dict() if "Common Stock Equity" in bal.index else None, "shares", bal.loc["Ordinary Shares Number"].to_dict() if "Ordinary Shares Number" in bal.index else None)
              except Exception as e: print("YF",s,"ERR",type(e).__name__,e)
          print("yf secs", round(time.time()-t0,1))
          PY
