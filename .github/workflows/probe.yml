name: 점검용 (데이터 형식 확인)
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -q yfinance pandas requests
      - run: |
          python3 - <<'PY'
          import yfinance as yf, pandas as pd, requests, json
          pd.set_option("display.width",250)
          print("yfinance", yf.__version__)
          # 분할·배당이 있었던 종목들 (NVDA 2024-06 10:1, AAPL 배당, 삼성전자 배당, 005935)
          raw = yf.download(["NVDA","AAPL","005930.KS","KO"], start="2024-05-01", end="2024-06-20", auto_adjust=False, actions=True, group_by="column", progress=False)
          print("COLUMNS", sorted(set(raw.columns.get_level_values(0))))
          print(raw.xs("NVDA", axis=1, level=1).loc["2024-06-05":"2024-06-12"].to_string())
          ko = raw.xs("KO", axis=1, level=1); print(ko[ko["Dividends"]>0].to_string())
          ss = raw.xs("005930.KS", axis=1, level=1); print(ss[ss["Dividends"]>0].to_string()); print(ss.tail(2).to_string())
          for s in ["^KS11","^KQ11","^GSPC","^RUT","^SP500TR","KRW=X"]:
              try:
                  h=yf.Ticker(s).history(period="5d"); print("IDX", s, len(h), h["Close"].iloc[-1])
              except Exception as e: print("IDX", s, "ERR", e)
          j=requests.get("https://m.stock.naver.com/api/stocks/marketValue/KOSDAQ?page=1&pageSize=100",headers={"User-Agent":"Mozilla/5.0 (iPhone)"},timeout=30).json()
          from collections import Counter
          print("tradeStop", Counter(json.dumps(x.get("tradeStopType"),ensure_ascii=False) for x in j["stocks"]))
          print("endTypes", Counter(x.get("stockEndType") for x in j["stocks"]))
          print("keys", sorted(j["stocks"][0].keys()))
          r=requests.get("https://api.nasdaq.com/api/screener/stocks?tableonly=true&download=true&exchange=nyse",headers={"User-Agent":"Mozilla/5.0"},timeout=60).json()["data"]["rows"]
          df=pd.DataFrame(r); m=df[df["name"].str.contains(r"\b(Fund|Trust|ETF|Income|Municipal)\b",regex=True)]
          print("FUNDLIKE", len(m)); print(m[["symbol","name","sector","industry","marketCap"]].head(40).to_string())
          print(df[df.symbol.isin(["BME","XCH"])][["symbol","name","sector","industry","marketCap"]].to_string())
          PY
