name: 점검용 (네이버 페이지 확인)
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          python3 - <<'PY'
          import requests, json
          UA={"User-Agent":"Mozilla/5.0 (iPhone; CPU iPhone OS 17_0 like Mac OS X)"}
          def g(u):
              r=requests.get(u,headers=UA,timeout=30); print("=====",u,r.status_code); return r
          j=g("https://m.stock.naver.com/api/stocks/marketValue/KOSPI?page=1&pageSize=100").json()
          print({k:v for k,v in j.items() if k!="stocks"}, len(j["stocks"])); print(json.dumps(j["stocks"][0],ensure_ascii=False))
          j=g("https://m.stock.naver.com/api/stocks/marketValue/KOSDAQ?page=1&pageSize=100").json(); print({k:v for k,v in j.items() if k!="stocks"})
          for u in ["https://m.stock.naver.com/api/stock/005930/integration","https://m.stock.naver.com/api/stock/005930/basic",
                    "https://m.stock.naver.com/api/stock/005930/finance/annual"]:
              try: print(json.dumps(g(u).json(),ensure_ascii=False)[:3500])
              except Exception as e: print("ERR",e)
          PY
